<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bonus Hunt List - OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Slot Database -->
  <script src="slotdatabase.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: transparent;
      color: #f3f4f6;
      overflow: hidden;
      padding: 20px;
    }

    .bonus-list-container {
      max-width: 450px;
      margin: 0 auto;
    }

    .bonus-list-header {
      background: linear-gradient(135deg, rgba(147, 70, 255, 0.3), rgba(0, 225, 255, 0.3));
      padding: 15px 20px;
      border-radius: 12px 12px 0 0;
      border: 2px solid rgba(147, 70, 255, 0.5);
      border-bottom: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bonus-list-header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(147, 70, 255, 0.8);
    }

    .carousel-container {
      background: linear-gradient(135deg, rgba(26, 27, 46, 0.95), rgba(22, 33, 62, 0.95));
      border: 2px solid rgba(147, 70, 255, 0.5);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 20px;
      position: relative;
      min-height: 200px;
      overflow: hidden;
    }

    .single-bonus-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .bonus-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      width: 100%;
    }

    .nav-button {
      background: linear-gradient(135deg, rgba(147, 70, 255, 0.3), rgba(0, 225, 255, 0.3));
      border: 2px solid rgba(147, 70, 255, 0.5);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 14px;
    }

    .nav-button:hover {
      background: linear-gradient(135deg, rgba(147, 70, 255, 0.5), rgba(0, 225, 255, 0.5));
      transform: translateY(-1px);
    }

    .nav-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .bonus-counter {
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
    }

    .bonus-list {
      list-style: none;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .auto-cycle-controls {
      margin-top: 15px;
      text-align: center;
    }

    .auto-cycle-btn {
      background: linear-gradient(135deg, rgba(147, 70, 255, 0.3), rgba(0, 225, 255, 0.3));
      border: 2px solid rgba(147, 70, 255, 0.5);
      border-radius: 8px;
      color: #fff;
      padding: 6px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .auto-cycle-btn.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(34, 197, 94, 0.3));
      border-color: rgba(16, 185, 129, 0.5);
    }

    .auto-cycle-btn:hover {
      transform: translateY(-1px);
    }

    .bonus-item {
      background: linear-gradient(135deg, rgba(147, 70, 255, 0.15), rgba(0, 225, 255, 0.15));
      border: 2px solid rgba(147, 70, 255, 0.4);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
      min-height: 100px;
    }

    .bonus-item.super-slot {
      border: 2px solid #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: superGlow 2s ease-in-out infinite;
    }

    @keyframes superGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
      }
    }

    .bonus-slot-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid rgba(147, 70, 255, 0.5);
      flex-shrink: 0;
    }

    .bonus-info-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bonus-slot-name {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 5px rgba(147, 70, 255, 0.5);
    }

    .bonus-metrics {
      display: flex;
      gap: 15px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 600;
      color: #00e1ff;
    }

    .metric-value.completed {
      color: #10b981;
    }

    .metric-value.pending {
      color: #6b7280;
    }

    .metric-label {
      font-size: 11px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state-text {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state-subtext {
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="bonus-list-container">
    <div class="bonus-list-header">
      <h2>🎰 Bonus List</h2>
    </div>
    <div class="carousel-container">
      <div class="single-bonus-container">
        <div class="bonus-navigation" id="bonus-navigation" style="display: none;">
          <button class="nav-button" id="prev-btn">← Previous</button>
          <div class="bonus-counter">
            <span id="current-index">1</span> of <span id="total-bonuses">1</span>
          </div>
          <button class="nav-button" id="next-btn">Next →</button>
        </div>
        
        <ul class="bonus-list" id="bonus-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-state-icon">🎰</div>
            <div class="empty-state-text">No bonuses yet</div>
            <div class="empty-state-subtext">Waiting for bonuses from main window...</div>
          </div>
        </ul>
        
        <div class="auto-cycle-controls" id="auto-cycle-controls" style="display: none;">
          <button class="auto-cycle-btn" id="auto-cycle-btn">▶ Auto Cycle (5s)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Listen for bonus list updates from localStorage
    function loadBonuses() {
      try {
        const savedData = localStorage.getItem('bonusHuntData');
        if (savedData) {
          const data = JSON.parse(savedData);
          return data.bonuses || [];
        }
      } catch (e) {
        console.error('Error loading bonuses:', e);
      }
      return [];
    }

    function getSlotImage(slotName) {
      const defaultImage = 'https://i.imgur.com/8E3ucNx.png';
      
      // First check if there's a custom image URL
      try {
        const savedImages = localStorage.getItem('customSlotImages');
        if (savedImages) {
          const images = JSON.parse(savedImages);
          if (images[slotName.toLowerCase()]) {
            return images[slotName.toLowerCase()];
          }
        }
      } catch (e) {
        console.error('Error loading custom images:', e);
      }
      
      // Then check the slot database
      if (typeof window.slotDatabase !== 'undefined' && window.slotDatabase && window.slotDatabase.length > 0) {
        const slot = window.slotDatabase.find(s => s.name.toLowerCase() === slotName.toLowerCase());
        if (slot && slot.image) {
          return slot.image;
        }
      }
      
      return defaultImage;
    }

    // Single bonus display variables
    let currentBonusIndex = 0;
    let allBonuses = [];
    let autoCycleInterval = null;
    let autoCycleEnabled = false;

    function renderBonusList(bonuses) {
      const bonusListEl = document.getElementById('bonus-list');
      const emptyStateEl = document.getElementById('empty-state');
      const navigationEl = document.getElementById('bonus-navigation');
      const autoCycleControlsEl = document.getElementById('auto-cycle-controls');
      
      allBonuses = bonuses || [];
      
      if (!bonuses || bonuses.length === 0) {
        emptyStateEl.style.display = 'block';
        navigationEl.style.display = 'none';
        autoCycleControlsEl.style.display = 'none';
        currentBonusIndex = 0;
        clearAutoCycle();
        return;
      }
      
      emptyStateEl.style.display = 'none';
      
      // Show navigation and controls if more than one bonus
      if (bonuses.length > 1) {
        navigationEl.style.display = 'flex';
        autoCycleControlsEl.style.display = 'block';
      } else {
        navigationEl.style.display = 'none';
        autoCycleControlsEl.style.display = 'none';
        clearAutoCycle();
      }
      
      // Ensure current index is valid
      if (currentBonusIndex >= bonuses.length) {
        currentBonusIndex = 0;
      }
      
      displayCurrentBonus();
      updateNavigationState();
    }

    function displayCurrentBonus() {
      const bonusListEl = document.getElementById('bonus-list');
      
      if (!allBonuses || allBonuses.length === 0) return;
      
      const bonus = allBonuses[currentBonusIndex];
      const slotImage = getSlotImage(bonus.slot);
      
      bonusListEl.innerHTML = `
        <li class="bonus-item${bonus.isSuper ? ' super-slot' : ''}">
          <img src="${slotImage}" alt="${bonus.slot}" class="bonus-slot-image">
          <div class="bonus-info-section">
            <div class="bonus-slot-name">${bonus.slot}</div>
            <div class="bonus-metrics">
              <div class="metric-item">
                <div class="metric-value">€${bonus.bet.toFixed(2)}</div>
                <div class="metric-label">BET</div>
              </div>
              <div class="metric-item">
                <div class="metric-value ${bonus.payout !== null ? 'completed' : 'pending'}">
                  ${bonus.payout !== null ? '€' + bonus.payout.toFixed(2) : '--'}
                </div>
                <div class="metric-label">WIN</div>
              </div>
              <div class="metric-item">
                <div class="metric-value">${bonus.multiplier.toFixed(2)}x</div>
                <div class="metric-label">MULT</div>
              </div>
            </div>
          </div>
        </li>
      `;
    }

    function updateNavigationState() {
      if (!allBonuses || allBonuses.length <= 1) return;
      
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const currentIndexEl = document.getElementById('current-index');
      const totalBonusesEl = document.getElementById('total-bonuses');
      
      currentIndexEl.textContent = currentBonusIndex + 1;
      totalBonusesEl.textContent = allBonuses.length;
      
      // Enable/disable navigation buttons (optional - remove if you want infinite cycling)
      // prevBtn.disabled = currentBonusIndex === 0;
      // nextBtn.disabled = currentBonusIndex === allBonuses.length - 1;
    }

    function navigateToNext() {
      if (!allBonuses || allBonuses.length <= 1) return;
      
      currentBonusIndex = (currentBonusIndex + 1) % allBonuses.length;
      displayCurrentBonus();
      updateNavigationState();
    }

    function navigateToPrevious() {
      if (!allBonuses || allBonuses.length <= 1) return;
      
      currentBonusIndex = currentBonusIndex === 0 ? allBonuses.length - 1 : currentBonusIndex - 1;
      displayCurrentBonus();
      updateNavigationState();
    }

    function toggleAutoCycle() {
      const autoCycleBtn = document.getElementById('auto-cycle-btn');
      
      if (autoCycleEnabled) {
        clearAutoCycle();
        autoCycleBtn.textContent = '▶ Auto Cycle (5s)';
        autoCycleBtn.classList.remove('active');
      } else {
        startAutoCycle();
        autoCycleBtn.textContent = '⏸ Auto Cycle (5s)';
        autoCycleBtn.classList.add('active');
      }
    }

    function startAutoCycle() {
      if (autoCycleInterval) clearInterval(autoCycleInterval);
      
      autoCycleEnabled = true;
      autoCycleInterval = setInterval(() => {
        navigateToNext();
      }, 5000); // 5 seconds per bonus
    }

    function clearAutoCycle() {
      autoCycleEnabled = false;
      if (autoCycleInterval) {
        clearInterval(autoCycleInterval);
        autoCycleInterval = null;
      }
    }

    // Keep track of last data to detect changes
    let lastDataString = '';

    function updateIfChanged() {
      const currentDataString = localStorage.getItem('bonusHuntData') || '';
      if (currentDataString !== lastDataString) {
        lastDataString = currentDataString;
        const newBonuses = loadBonuses();
        
        // Try to maintain the current position if possible
        if (allBonuses.length > 0 && newBonuses.length > 0) {
          const currentBonus = allBonuses[currentBonusIndex];
          if (currentBonus) {
            // Find the same bonus in the new list
            const newIndex = newBonuses.findIndex(bonus => 
              bonus.slot === currentBonus.slot && 
              bonus.bet === currentBonus.bet
            );
            if (newIndex !== -1) {
              currentBonusIndex = newIndex;
            } else if (currentBonusIndex >= newBonuses.length) {
              currentBonusIndex = Math.max(0, newBonuses.length - 1);
            }
          }
        }
        
        renderBonusList(newBonuses);
      }
    }

    // Set up navigation event listeners
    document.getElementById('prev-btn').addEventListener('click', navigateToPrevious);
    document.getElementById('next-btn').addEventListener('click', navigateToNext);
    document.getElementById('auto-cycle-btn').addEventListener('click', toggleAutoCycle);

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        navigateToPrevious();
      } else if (e.key === 'ArrowRight') {
        navigateToNext();
      } else if (e.key === ' ') {
        e.preventDefault();
        toggleAutoCycle();
      }
    });

    // Initial load
    renderBonusList(loadBonuses());
    lastDataString = localStorage.getItem('bonusHuntData') || '';

    // Poll for updates every 500ms
    setInterval(() => {
      updateIfChanged();
    }, 500);

    // Auto refresh page every 15 seconds
    setInterval(() => {
      location.reload();
    }, 15000);

    // Also listen for storage events (when updated from another window)
    window.addEventListener('storage', (e) => {
      if (e.key === 'bonusHuntData') {
        updateIfChanged();
      }
    });
  </script>
</body>
</html>
